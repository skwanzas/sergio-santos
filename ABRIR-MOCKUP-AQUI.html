<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="0; url=./mockup-endiagro-frontend.html">
    <title>Abrindo ENDIAGRO Mockup...</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #16a34a 0%, #15803d 100%);
            color: white;
        }
        .container {
            text-align: center;
        }
        h1 { font-size: 2rem; margin-bottom: 1rem; }
        p { font-size: 1.2rem; }
        .spinner {
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 2rem auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        a {
            color: white;
            text-decoration: underline;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌾 ENDIAGRO</h1>
        <div class="spinner"></div>
        <p>Abrindo o mockup dinâmico...</p>
        <p style="margin-top: 2rem;">
            Se não abrir automaticamente,
            <a href="./mockup-endiagro-frontend.html">clique aqui</a>
        </p>
    </div>
</body>
</html>
