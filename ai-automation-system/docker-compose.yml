version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: ai_automation_postgres
    environment:
      POSTGRES_DB: ai_automation
      POSTGRES_USER: ai_user
      POSTGRES_PASSWORD: ai_password_2024
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_user -d ai_automation"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai_network

  # Redis (Message Broker & Cache)
  redis:
    image: redis:7-alpine
    container_name: ai_automation_redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai_network

  # Neo4j Graph Database (opcional)
  neo4j:
    image: neo4j:5-community
    container_name: ai_automation_neo4j
    environment:
      NEO4J_AUTH: neo4j/neo4j_password_2024
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    volumes:
      - neo4j_data:/data
    networks:
      - ai_network

  # FastAPI Backend
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_automation_api
    command: /app/docker-entrypoint.sh
    environment:
      - DEBUG=True
      - DATABASE_URL=postgresql://ai_user:ai_password_2024@postgres:5432/ai_automation
      - REDIS_URL=redis://redis:6379/0
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=neo4j_password_2024
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - SECRET_KEY=super-secret-key-change-in-production-2024
      - OPENAI_API_KEY=${OPENAI_API_KEY:-your-openai-key-here}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
    networks:
      - ai_network

  # Celery Worker - Market Research Queue
  worker_market:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_automation_worker_market
    command: celery -A app.core.celery_app worker --queue=market_research --concurrency=2 --loglevel=info
    environment:
      - DATABASE_URL=postgresql://ai_user:ai_password_2024@postgres:5432/ai_automation
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - SECRET_KEY=super-secret-key-change-in-production-2024
      - OPENAI_API_KEY=${OPENAI_API_KEY:-your-openai-key-here}
    depends_on:
      - redis
      - postgres
      - api
    volumes:
      - ./app:/app/app
    networks:
      - ai_network

  # Celery Worker - Risk Analysis & Copywriter Queue
  worker_analysis:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_automation_worker_analysis
    command: celery -A app.core.celery_app worker --queue=risk_analysis,copywriter --concurrency=2 --loglevel=info
    environment:
      - DATABASE_URL=postgresql://ai_user:ai_password_2024@postgres:5432/ai_automation
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - SECRET_KEY=super-secret-key-change-in-production-2024
      - OPENAI_API_KEY=${OPENAI_API_KEY:-your-openai-key-here}
    depends_on:
      - redis
      - postgres
      - api
    volumes:
      - ./app:/app/app
    networks:
      - ai_network

  # Celery Worker - Default Queue (Orchestrator)
  worker_default:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_automation_worker_default
    command: celery -A app.core.celery_app worker --queue=default --concurrency=1 --loglevel=info
    environment:
      - DATABASE_URL=postgresql://ai_user:ai_password_2024@postgres:5432/ai_automation
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - SECRET_KEY=super-secret-key-change-in-production-2024
      - OPENAI_API_KEY=${OPENAI_API_KEY:-your-openai-key-here}
    depends_on:
      - redis
      - postgres
      - api
    volumes:
      - ./app:/app/app
    networks:
      - ai_network

  # Flower - Celery Monitoring Dashboard
  flower:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_automation_flower
    command: celery -A app.core.celery_app flower --port=5555
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    ports:
      - "5555:5555"
    depends_on:
      - redis
      - worker_market
      - worker_analysis
      - worker_default
    networks:
      - ai_network

  # React Frontend Dashboard
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai_automation_frontend
    ports:
      - "3000:80"
    depends_on:
      - api
    networks:
      - ai_network
    environment:
      - VITE_API_URL=http://localhost:8000

volumes:
  postgres_data:
  redis_data:
  neo4j_data:

networks:
  ai_network:
    driver: bridge
